name: ci
on:
  push:
    branches:
      - main
      - "*.x"
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # needed for correct revision dates in commits
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
          cache: pip
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system .
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine docs version identifier
        id: docs_version
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "version=5.x" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - run: mike deploy --config-file mkdocs-docs.yml --push ${{ steps.docs_version.outputs.version }}

      - name: Build main site
        if: github.ref == 'refs/heads/main'
        run: mkdocs build --config-file mkdocs.yml
      - name: Deploy main site to gh-pages root
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
